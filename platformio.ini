; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common options inherited by all environments below
; https://docs.platformio.org/page/projectconf/section_env.html
[env]
; include/ is on the path for src/ automatically, but NOT for custom libs in
; lib/ (e.g. TimeManager needs <secrets.h>) — add it for all envs.
build_flags =
    -I include
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.15
    milesburton/DallasTemperature@^4.0.6
    paulstoffregen/OneWire@^2.3.8
    br3ttb/PID@^1.2.0
    signetica/SunRise@^2.1.0
    dawidchyrzynski/home-assistant-integration@^2.1.0
    knolleary/PubSubClient@^2.8
    https://github.com/robotdyn-dimmer/rbdimmerESP32.git#V1.0.0

; pioarduino community platform (official PlatformIO espressif32 is frozen at
; Arduino core 2.0.17; rgbLedWrite needs core 3.x). 55.03.311 = core 3.3.11.
[env:hosyond_esp32s3_n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = hosyond_esp32s3_n16r8
lib_deps = 
    ${env.lib_deps}
test_ignore =
    test_lamp
    test_led
    test_sensor
    test_climate
    test_time

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
lib_deps = 
    ${env.lib_deps}
test_ignore =
    test_lamp
    test_led
    test_sensor
    test_climate
    test_time

; Host-side unit tests. Managers compile against the fake headers in
; test/mocks (include path wins over real vendor libs, which are ignored);
; only the pure-C++ PID library is built for real. ARDUINO=100 routes
; PID_v1.cpp to Arduino.h (our mock) instead of WProgram.h. Compat checks
; are off because PID's manifest claims arduino-only; lib_ignore fences
; out every hardware-dependent library.
[env:native]
platform = native
test_framework = unity
build_flags =
    -I test/mocks
    -I include
    -std=gnu++2a
    -DARDUINO=100
    -DUNITY_INCLUDE_DOUBLE
lib_compat_mode = off
lib_ignore =
    rbdimmerESP32
    DHT sensor library
    Adafruit Unified Sensor
    DallasTemperature
    OneWire
    PubSubClient
    home-assistant-integration
    SunRise
